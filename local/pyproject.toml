[build-system]
requires = [
  "setuptools==75.3.4; python_version < '3.10'",
  "setuptools==84.2.1; python_version >= '3.10'",
]
build-backend = "setuptools.build_meta"

[project]
name = "devflow-workflow"
version = "0.2.3"
description = "Friday Local development workflows for Codex, Cursor, and Claude Code"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Friday Contributors"}]
keywords = ["ai-agents", "multi-agent", "coding-agent", "codex", "claude-code"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://github.com/Tencent/Friday"
Issues = "https://github.com/Tencent/Friday/issues"
Changelog = "https://github.com/Tencent/Friday/blob/main/CHANGELOG.md"

[project.scripts]
friday = "devflow_cli.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
